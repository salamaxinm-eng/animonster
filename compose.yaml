services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: animonster
      POSTGRES_USER: animonster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animonster -d animonster"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [web]
  migrate:
    build:
      context: .
      target: migrate
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://animonster:${POSTGRES_PASSWORD}@postgres:5432/animonster
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [web]
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://animonster:${POSTGRES_PASSWORD}@postgres:5432/animonster
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [web]
    depends_on:
      migrate:
        condition: service_completed_successfully
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    env_file: .env.production
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      app:
        condition: service_healthy
    networks: [web]
networks:
  web:
volumes:
  caddy_data:
  postgres_data:
