name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: animonster
          POSTGRES_PASSWORD: test
          POSTGRES_DB: animonster_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U animonster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://animonster:test@localhost:5432/animonster_test
      TEST_DATABASE_URL: postgres://animonster:test@localhost:5432/animonster_test
      SITE_URL: http://localhost:3000
      OWNER_PREVIEW: "false"
      PAYMENTS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:migrate
      - run: npm test
      - run: npm run lint
      - run: npm run build
