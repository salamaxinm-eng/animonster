# Include in the current application's HTTPS server, before the legacy proxy.
location ^~ /demo-media/enhanced/ {
    alias /var/lib/animonster-media/enhanced/published/;
    autoindex off;
    disable_symlinks on;
    limit_except GET { deny all; }
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
        text/vtt vtt;
        video/mp4 mp4;
        image/jpeg jpg;
    }
    location ~ \.json$ { deny all; }
    add_header Cache-Control "public, max-age=86400, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    sendfile on;
}
