# Include in HTTPS server. Only completed media is exposed.
location = /demo-media/catalog.json {
    alias /var/lib/animonster-media/catalog.json;
    allow 177.3.218.227;
    allow 127.0.0.1;
    deny all;
    default_type application/json;
    add_header Cache-Control no-store always;
}
location /demo-media/ {
    alias /var/lib/animonster-media/published/;
    autoindex off;
    disable_symlinks on;
    limit_except GET { deny all; }
    types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; text/vtt vtt; }
    location ~ \.json$ { deny all; }
    add_header Cache-Control "public, max-age=86400, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    sendfile on;
}
