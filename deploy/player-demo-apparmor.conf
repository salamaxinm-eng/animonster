# Append to /etc/apparmor.d/local/transmission-daemon, then reload the Transmission profile.
# Preserve AppArmor enforcement. No access to published media or site data is granted.
owner /var/lib/animonster-media/ r,
owner /var/lib/animonster-media/downloads/ rw,
owner /var/lib/animonster-media/downloads/** rwk,
owner /var/lib/animonster-media/transmission/ rw,
owner /var/lib/animonster-media/transmission/** rwk,
